<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Purple Book Nook</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <nav>
    <div class="nav-content">
      <a href="index.html" class="logo">
        <i data-lucide="book-open"></i>
        <span>Book Nook</span>
      </a>
      <div class="nav-links">
        <a href="login.html">Admin Login</a>
      </div>
    </div>
  </nav>

  <div class="container">
    <div class="card">
      <div class="header-title">
        <i data-lucide="library" style="color: var(--primary);"></i>
        <h2>Available Catalog</h2>
      </div>
      
      <div class="table-container">
        <table id="booksTable">
          <thead>
            <tr>
              <th>Title</th>
              <th>Author</th>
              <th>Genre</th>
              <th>Price</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    fetch('/api/books')
      .then(res => res.json())
      .then(books => {
        const tbody = document.querySelector('#booksTable tbody');
        tbody.innerHTML = books.map(b => `
          <tr>
            <td style="font-weight: 600;">${b.title}</td>
            <td style="color: var(--text-muted);">${b.author}</td>
            <td><span class="badge">${b.genre}</span></td>
            <td style="font-weight: 600;">${b.price.toFixed(2)} €</td>
          </tr>
        `).join('');
        lucide.createIcons();
      });
  </script>
</body>
</html>
