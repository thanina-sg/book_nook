<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - Purple Book Nook</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <nav>
    <div class="nav-content">
      <a href="index.html" class="logo">
        <i data-lucide="book-open"></i>
        <span>Book Nook <span style="font-size: 0.8rem; opacity: 0.7; font-weight: 400;">Admin</span></span>
      </a>
      <div class="nav-links">
        <a href="index.html" style="display: flex; align-items: center; gap: 0.3rem;">
          <i data-lucide="log-out" style="width: 16px;"></i> Logout
        </a>
      </div>
    </div>
  </nav>

  <div class="container">
    <!-- Add Book Section -->
    <div class="card">
      <div class="header-title">
        <i data-lucide="plus-circle" style="color: var(--primary);"></i>
        <h3>Add New Book</h3>
      </div>
      <form id="addBookForm">
        <div class="form-grid">
          <div class="input-group">
            <label>Title</label>
            <input type="text" id="title" placeholder="e.g. Dune" required>
          </div>
          <div class="input-group">
            <label>Author</label>
            <input type="text" id="author" placeholder="e.g. Frank Herbert" required>
          </div>
          <div class="input-group">
            <label>Genre</label>
            <input type="text" id="genre" placeholder="e.g. Sci-Fi" required>
          </div>
          <div class="input-group">
            <label>Price (€)</label>
            <input type="number" step="0.01" id="price" placeholder="18.50" required>
          </div>
          <div class="input-group">
            <label>Stock</label>
            <input type="number" id="stock" placeholder="10" required>
          </div>
        </div>
        <button type="submit" style="margin-top: 1.25rem;">
          <i data-lucide="plus" style="width: 16px;"></i>
          <span>Add to Inventory</span>
        </button>
      </form>
    </div>

    <!-- Inventory Table -->
    <div class="card">
      <div class="header-title">
        <i data-lucide="boxes" style="color: var(--primary);"></i>
        <h3>Inventory Management</h3>
      </div>
      <div class="table-container">
        <table id="adminBooksTable">
          <thead>
            <tr>
              <th>Title</th>
              <th>Author</th>
              <th>Genre</th>
              <th>Price</th>
              <th>Stock</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    function loadBooks() {
      fetch('/api/books')
        .then(res => res.json())
        .then(books => {
          const tbody = document.querySelector('#adminBooksTable tbody');
          tbody.innerHTML = books.map(b => `
            <tr>
              <td style="font-weight: 600;">${b.title}</td>
              <td style="color: var(--text-muted);">${b.author}</td>
              <td><span class="badge">${b.genre}</span></td>
              <td style="font-weight: 600;">${b.price.toFixed(2)} €</td>
              <td>${b.stock}</td>
              <td>
                <button onclick="deleteBook(${b.id})" class="btn-danger">
                  <i data-lucide="trash-2" style="width: 14px;"></i>
                  <span>Delete</span>
                </button>
              </td>
            </tr>
          `).join('');
          lucide.createIcons();
        });
    }

    document.getElementById('addBookForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      await fetch('/api/books', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          title: e.target.title.value,
          author: e.target.author.value,
          genre: e.target.genre.value,
          price: parseFloat(e.target.price.value),
          stock: parseInt(e.target.stock.value)
        })
      });
      e.target.reset();
      loadBooks();
    });

    async function deleteBook(id) {
      await fetch(`/api/books/${id}`, { method: 'DELETE' });
      loadBooks();
    }

    loadBooks();
  </script>
</body>
</html>
